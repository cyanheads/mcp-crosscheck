name: Bug report
description: Report a reproducible mcp-crosscheck defect
title: "bug: "
labels:
  - bug
assignees:
  - cyanheads
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. A finding can be real server or client behavior that crosscheck reported correctly — if you're unsure, see the [before-filing steps](https://github.com/cyanheads/mcp-crosscheck/blob/main/.github/CONTRIBUTING.md#before-filing).

        **Do not include secrets.** Replace credentials, auth headers, tokens, and private endpoints with placeholders. Raw `--artifacts` captures are local-sensitive and should not be uploaded. GitHub issues are public and permanent.

        **Secondary labels.** `bug` is applied automatically — also add one or more of the following in the sidebar if they apply:
        - `engine` — invariant engine, schema normalization, findings, baselines
        - `adapter` — a client adapter or its capture profile
        - `ops` — auth, headers, baselines in CI, running-server usage
        - `test-infra` — fixture server, E2E suite, test tooling
        - `regression` — worked before, broken after an update
        - `performance` — memory, CPU, latency, or resource usage
        - `security` — vulnerability or hardening work
        - `breaking-change` — the fix changes the library API, the report shape, or baseline identities
  - type: input
    id: crosscheck_version
    attributes:
      label: mcp-crosscheck version
      description: Run `mcp-crosscheck --version`.
      placeholder: x.y.z
    validations:
      required: true
  - type: dropdown
    id: adapter
    attributes:
      label: Adapter
      description: Select the affected adapter, or choose the adapter-independent option.
      options:
        - Not adapter-specific
        - MCP Inspector
        - mcpo
        - Codex CLI
        - Claude Code
    validations:
      required: true
  - type: input
    id: adapter_version
    attributes:
      label: Resolved client version
      description: Copy the version from the report, or enter "not applicable" for adapter-independent or pre-report failures.
      placeholder: 2.1.0 or not applicable
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Target transport
      options:
        - stdio
        - streamable HTTP
        - Not reached
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include OS, architecture, Node version, and Bun version.
      placeholder: Windows 11, x64, Node 22.21.0, Bun 1.3.14
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what you expected instead — two or three sentences. Name the rule, adapter, flag, or tool.
      placeholder: Codex reports `tool-missing` for `search_docs`, but the tool appears in Codex's captured request.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest command that reproduces the problem. Replace credentials, headers, tokens, and private endpoints with placeholders.
      render: shell
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Report or redacted output
      description: Paste the JSON report or a redacted stdout/stderr excerpt. If the failure occurred before a report was produced, explain that here.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: The finding, status, or error as it appeared.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Only what changes the fix — a workaround, a related issue, the one log line that matters.
    validations:
      required: false
  - type: checkboxes
    id: redaction
    attributes:
      label: Sensitive data check
      options:
        - label: I reviewed commands, output, and attachments and removed credentials, auth headers, tokens, private endpoints, and other sensitive data.
          required: true
